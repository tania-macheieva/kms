<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Domain Knowledge Hub — демонстратор</title>
<style>:root{--bg:#fff;--fg:#1c1c1c;--mut:#666;--card:#f4f5f7;--acc:#2a6fdb}@media(prefers-color-scheme:dark){:root{--bg:#16181c;--fg:#e8e8e8;--mut:#9aa;--card:#22262c;--acc:#6aa3ff}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}main{max-width:900px;margin:0 auto;padding:16px}h1{font-size:20px}section{background:var(--card);border-radius:8px;padding:12px 16px;margin:14px 0}
input,select,button,textarea{font:inherit;padding:6px 8px;border-radius:6px;border:1px solid #8886;background:var(--bg);color:var(--fg)}button{background:var(--acc);color:#fff;border:0;cursor:pointer}pre{white-space:pre-wrap;word-break:break-word}small{color:var(--mut)}li{margin:6px 0}</style>
<main><h1>Domain Knowledge Hub — пошук, відповідь, рекомендації</h1><small>Інтеракції синтетичні (див. docs/reco_eval.md). Ролі: reader / analyst / clinician.</small>
<section><b>Запитання</b><br><input id="q" size="60" value="Which QD threshold does GATK hard filtering use?"> <select id="role"><option>reader</option><option>analyst</option><option>clinician</option></select> <button onclick="ask()">Спитати</button><pre id="ans"></pre></section>
<section><b>Рекомендації для користувача</b><br><select id="user"></select> <button onclick="reco()">Показати</button><ol id="rec"></ol></section>
<section><b>Новий користувач (cold start)</b><br>тема: <select id="topic"><option>pipelines</option><option>rare</option><option>bcftools</option><option>gatk</option><option>annot</option><option>hub</option></select> <button onclick="cold()">Рекомендувати</button><small id="strat"></small><ol id="cold"></ol></section></main>
<script>const $=i=>document.getElementById(i),J=async(u,o)=>(await fetch(u,o)).json();
async function ask(){const r=await J('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({q:$('q').value,role:$('role').value})});$('ans').textContent=r.status+'\n'+r.answer+'\n'+r.citations.map(c=>'['+c.id+'] '+c.source).join('\n')}
async function reco(){const r=await J('/api/recommend/'+$('user').value);$('rec').innerHTML=r.recommendations.map(x=>'<li>'+x.explanation.replace(/</g,'&lt;')+'</li>').join('')}
async function cold(){const r=await J('/api/recommend/new-user',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topics:[$('topic').value]})});$('strat').textContent=' стратегія: '+r.strategy;$('cold').innerHTML=r.recommendations.map(x=>'<li>'+x.explanation.replace(/</g,'&lt;')+'</li>').join('')}
J('/api/users').then(u=>{$('user').innerHTML=u.map(x=>'<option value="'+x.user+'">'+x.user+' ('+x.role+')</option>').join('')})</script></html>
